# Forzar H2 para los tests
spring.datasource.url=jdbc:h2:mem:testdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Desactivar Swagger en tests para que cargue más rápido
springdoc.swagger-ui.enabled=false

# Configuración falsa de correo para que no falle al iniciar el contexto
spring.mail.host=localhost
spring.mail.port=25
spring.mail.username=test@test.com
spring.mail.password=test

# JWT Falso para tests
app.jwt.secret=ClaveSecretaDePruebasMuyLargaParaQueNoFalleElTest123456789
app.jwt.expiration=86400000