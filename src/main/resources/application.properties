spring.application.name=api-hexagonal
server.port=8080

# ==========================================
# PERFIL LOCAL: H2 Database (DESARROLLO)
# ==========================================
spring.datasource.url=jdbc:h2:mem:devdb
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
# Hibernate 6 detecta el dialecto automáticamente, no es necesario especificarlo
spring.jpa.hibernate.ddl-auto=update
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# ==========================================
# SWAGGER / OPENAPI
# ==========================================
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# ==========================================
# JWT (Local)
# ==========================================
app.jwt.secret=ClaveSecretaLocalMuyLargaYComplejaParaFirmarTokensJWT1234567890
app.jwt.expiration=86400000
app.frontend.url=http://localhost:3000

# NOTA: La configuración de correo se omite aquí para no romper el inicio local 
# si no tienes las credenciales. Se usará la de test o la de prod (Render).